name: Lockfile

# Fails when .github/workflows/actions.lock is out of sync with the workflows
# or a locked pin no longer verifies upstream.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify lockfile
        run: gh actions-lock --verify
