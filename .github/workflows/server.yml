name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: static build (linux/amd64, linux/arm64)
        run: |
          make dist
          file dist/*
      - name: upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sudoku-server
          path: server/dist/

  arm64:
    name: test on arm64
    # Runs the test suite (with the race detector) and a smoke test natively on
    # an arm64 runner, so arm64-specific breakage (e.g. in the pure-Go SQLite
    # driver) is caught on real hardware.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: smoke test arm64 binary
        run: |
          make dist PLATFORMS=linux/arm64
          file dist/sudoku-server-linux-arm64
          SUDOKU_AUTH_MODE=dev SUDOKU_SERVER_SECRET=ci-secret-0123456789 \
            SUDOKU_DB_PATH="$RUNNER_TEMP/smoke.db" SUDOKU_BIND=127.0.0.1:18080 \
            dist/sudoku-server-linux-arm64 &
          pid=$!
          for i in $(seq 30); do curl -sf localhost:18080/healthz && break; sleep 1; done
          curl -sf -H 'Authorization: Bearer dev:ci:CI' localhost:18080/api/v1/week
          kill $pid
