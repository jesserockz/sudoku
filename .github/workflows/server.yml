name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: static build (linux/${{ matrix.arch }})
        run: |
          make dist PLATFORMS=linux/${{ matrix.arch }}
          file dist/*
      - name: smoke test
        run: |
          SUDOKU_AUTH_MODE=dev SUDOKU_SERVER_SECRET=ci-secret-0123456789 \
            SUDOKU_DB_PATH="$RUNNER_TEMP/smoke.db" SUDOKU_BIND=127.0.0.1:18080 \
            dist/sudoku-server-linux-${{ matrix.arch }} &
          pid=$!
          for i in $(seq 30); do curl -sf localhost:18080/healthz && break; sleep 1; done
          curl -sf -H 'Authorization: Bearer dev:ci:CI' localhost:18080/api/v1/week
          kill $pid
      - name: upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # Uploaded as-is (no zip); the artifact takes the file's name.
          path: server/dist/sudoku-server-linux-${{ matrix.arch }}
          archive: false
          if-no-files-found: error
