name: Release

# On every push to main, Release Drafter resolves the next version from the
# merged PRs' labels. If it differs from the version tracked in the repository
# (server/internal/version and web/package.json), this workflow commits the
# bump to main. Pushes made with the workflow's token don't trigger workflows,
# so that commit doesn't start another run.
# Release Drafter then updates the draft release, targeting the bump commit,
# and this workflow rebuilds the server and the web client from that commit and
# attaches them to the draft, replacing what was there. Publishing the release
# deploys its attached `sudoku-web.zip` to GitHub Pages without rebuilding
# (pages.yml), so the site is exactly the bundle that was attached to the draft.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: true

jobs:
  draft:
    name: Update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag_name: ${{ steps.drafter.outputs.tag_name }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Resolve next version
        id: resolve
        uses: release-drafter/release-drafter@v7.10.0
        with:
          dry-run: true
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Set version
        env:
          VERSION: ${{ steps.resolve.outputs.resolved_version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::Release Drafter did not resolve a version"
            exit 1
          fi
          sed -i -E "s/^var Version = \".*\"$/var Version = \"$VERSION\"/" server/internal/version/version.go
          (cd web && npm version "$VERSION" --no-git-tag-version --allow-same-version)
      - name: Commit version bump
        id: bump
        env:
          VERSION: ${{ steps.resolve.outputs.resolved_version }}
        run: |
          if git diff --quiet; then
            echo "Version is already $VERSION"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Version needs bumping to $VERSION, which is only committed from main"
            exit 1
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Bump version to $VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update draft release
        id: drafter
        uses: release-drafter/release-drafter@v7.10.0
        with:
          commitish: ${{ steps.bump.outputs.sha }}

  server:
    name: Server binaries
    needs: draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Static build (linux/amd64, linux/arm64)
        run: make dist
      - name: Upload server binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-server
          path: server/dist/
          if-no-files-found: error

  web:
    name: Web bundle
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - name: Package
        run: |
          mkdir -p dist
          (cd web/dist && zip -qr "$GITHUB_WORKSPACE/dist/sudoku-web.zip" .)
      - name: Upload web bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-web
          path: dist/
          if-no-files-found: error

  attach:
    name: Attach to draft release
    needs: [draft, server, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.draft.outputs.sha }}
          sparse-checkout: .github/scripts
      - name: Download builds
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Replace the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          # The server's self-update verifies its download against this file.
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::$TAG is not a draft release; not touching its assets"
            exit 1
          fi
          # The version (and so the tag) can change between runs, and the draft
          # should only carry this commit's builds, so start from no assets.
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            while read -r name; do gh release delete-asset "$TAG" "$name" --yes; done
          gh release upload "$TAG" dist/*
      - name: Link the downloads in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          # Fetch the full release by id: a PATCH to a draft must re-send its
          # tag_name, name and target_commitish, or the tag resets to an
          # untagged-* placeholder.
          if ! id=$(gh release view "$TAG" --json databaseId --jq .databaseId); then
            echo "::error::Could not find the draft release $TAG"
            exit 1
          fi
          if ! release=$(gh api "repos/$GH_REPO/releases/$id"); then
            echo "::error::Could not fetch release $id"
            exit 1
          fi
          if [ "$(jq -r '.draft' <<< "$release")" != "true" ] ||
            [ "$(jq -r '.tag_name' <<< "$release")" != "$TAG" ]; then
            echo "::error::Release $id is not the draft for $TAG; not editing it"
            exit 1
          fi
          if ! body=$(.github/scripts/release-body.sh "$GH_REPO" "$TAG" <<< "$release"); then
            echo "::error::Could not build the release notes"
            exit 1
          fi
          printf '%s\n' "$body"
          jq --arg body "$body" \
            '{tag_name, name, target_commitish, prerelease, draft: true, body: $body}' <<< "$release" |
            gh api -X PATCH "repos/$GH_REPO/releases/$id" --input - --jq '.tag_name'
