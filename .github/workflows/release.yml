name: Release

# On every push to main, Release Drafter updates the draft release's notes and
# this workflow rebuilds the server and the web client and attaches them to the
# draft, replacing what was there. Publishing the release deploys its attached
# `sudoku-web.zip` to GitHub Pages without rebuilding (pages.yml), so the site
# is exactly the bundle that was attached to the draft.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: true

jobs:
  draft:
    name: Update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag_name: ${{ steps.drafter.outputs.tag_name }}
    steps:
      - name: Update draft release
        id: drafter
        uses: release-drafter/release-drafter@v7.10.0

  server:
    name: Server binaries
    needs: draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Static build (linux/amd64, linux/arm64)
        run: make dist
      - name: Upload server binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-server
          path: server/dist/
          if-no-files-found: error

  web:
    name: Web bundle
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - name: Package
        run: |
          mkdir -p dist
          (cd web/dist && zip -qr "$GITHUB_WORKSPACE/dist/sudoku-web.zip" .)
      - name: Upload web bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-web
          path: dist/
          if-no-files-found: error

  attach:
    name: Attach to draft release
    needs: [draft, server, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Replace the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          ls -l dist
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::$TAG is not a draft release; not touching its assets"
            exit 1
          fi
          # The version (and so the tag) can change between runs, and the draft
          # should only carry this commit's builds, so start from no assets.
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            while read -r name; do gh release delete-asset "$TAG" "$name" --yes; done
          gh release upload "$TAG" dist/*
