name: Workflow scripts

# Tests the helper scripts the workflows run from .github/scripts.

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run script tests
        run: .github/scripts/test-preview.sh
