name: Clients

on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
      - "deploy/**"
  pull_request:
    paths-ignore:
      - "server/**"
      - "deploy/**"

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared tests (JVM, Android, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test shared module on every target
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest :shared:jsNodeTest --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/

  web:
    name: Web app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build production bundle
        run: ./gradlew :webApp:webDist --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web/

  android:
    name: Android app (unit + UI tests, APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: androidApp/build/outputs/roborazzi/
