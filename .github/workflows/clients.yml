name: Clients

on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
      - "deploy/**"
  pull_request:
    paths-ignore:
      - "server/**"
      - "deploy/**"

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared tests (JVM, Android, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared module on every target
        run: ./gradlew :shared:jvmTest :shared:testDebugUnitTest :shared:jsNodeTest --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/

  web:
    name: Web app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build production bundle
        run: ./gradlew :webApp:webDist --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/
