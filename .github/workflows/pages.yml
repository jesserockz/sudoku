name: Web (GitHub Pages)

# Publishes the web client to GitHub Pages for serverless (seed) play, e.g.
# https://<owner>.github.io/<repo>/, when a release is published. It deploys
# the files in the release's attached `sudoku-web.zip` (built by release.yml
# for the draft) as they are, without rebuilding. Running it by hand redeploys the
# latest release, or the one named. Needs Settings → Pages → Source set to
# "GitHub Actions". See docs/WEB.md, "Hosting without a server".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (default the latest release)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the release's web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download $TAG --pattern sudoku-web.zip --output "$RUNNER_TEMP/sudoku-web.zip"
          unzip -q "$RUNNER_TEMP/sudoku-web.zip" -d "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
