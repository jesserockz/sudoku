name: Web (GitHub Pages)

# Publishes the web client to GitHub Pages for serverless (seed) play, e.g.
# https://<owner>.github.io/<repo>/. Opt-in: it runs only when started by hand
# from the Actions tab, and needs Settings → Pages → Source set to
# "GitHub Actions". See docs/WEB.md, "Hosting without a server".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
