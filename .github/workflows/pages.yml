name: Web (GitHub Pages)

# Publishes the web client to GitHub Pages for serverless (seed) play, e.g.
# https://<owner>.github.io/<repo>/, when a release is published. It deploys
# the release's attached `sudoku-web-pages.tar` (built by release.yml for the
# draft) byte for byte, without rebuilding. Running it by hand redeploys the
# latest release, or the one named. Needs Settings → Pages → Source set to
# "GitHub Actions". See docs/WEB.md, "Hosting without a server".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (default the latest release)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the release's Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download $TAG --pattern sudoku-web-pages.tar --output "$RUNNER_TEMP/artifact.tar"
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qx './index.html'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
