name: Web (GitHub Pages)

# Publishes the web client to GitHub Pages for serverless (seed) play, e.g.
# https://<owner>.github.io/<repo>/. Opt-in: it runs only when started by hand
# from the Actions tab, and needs Settings → Pages → Source set to
# "GitHub Actions". See docs/CLIENTS.md, "Hosting without a server".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build production bundle
        run: ./gradlew :webApp:webDist --console=plain
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
